name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speakflow-supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight Supabase migrations access
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: njoisdldoellzuqxkyuk
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out "%{http_code}" "https://api.supabase.com/v1/projects/$PROJECT_REF/database/migrations" --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Supabase migrations preflight failed (HTTP $HTTP_CODE)."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Supabase migrations preflight succeeded (HTTP 200)."

      - name: Apply pending migrations through Supabase Management API
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: njoisdldoellzuqxkyuk
        run: |
          set -euo pipefail

          for FILE in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            BASENAME="$(basename "$FILE" .sql)"
            NAME="${BASENAME#*_}"

            BODY_FILE="$(mktemp)"
            RESPONSE_FILE="$(mktemp)"

            python3 -c 'import json,sys,pathlib; print(json.dumps({"query": pathlib.Path(sys.argv[1]).read_text(), "name": sys.argv[2]}))' "$FILE" "$NAME" > "$BODY_FILE"

            HTTP_CODE="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out "%{http_code}" --request POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/migrations" --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header "Content-Type: application/json" --data-binary "@$BODY_FILE")"

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "Migration $BASENAME failed (HTTP $HTTP_CODE)."
              cat "$RESPONSE_FILE"
              exit 1
            fi

            echo "Migration $BASENAME applied successfully."
          done
