name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speakflow-supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending migrations through Supabase Management API
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: njoisdldoellzuqxkyuk
        run: |
          set -euo pipefail

          HISTORY_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --output "$HISTORY_FILE" --write-out "%{http_code}"             "https://api.supabase.com/v1/projects/$PROJECT_REF/database/migrations"             --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Could not read Supabase migration history (HTTP $HTTP_CODE)."
            exit 1
          fi

          for FILE in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            BASENAME="$(basename "$FILE" .sql)"
            VERSION="${BASENAME%%_*}"
            NAME="${BASENAME#*_}"

            if grep -q "\"version\":\"$VERSION\"" "$HISTORY_FILE" || grep -q "\"version\": \"$VERSION\"" "$HISTORY_FILE"; then
              echo "Migration $VERSION already applied; skipping."
              continue
            fi

            BODY_FILE="$(mktemp)"
            RESPONSE_FILE="$(mktemp)"
            python3 - "$FILE" "$NAME" > "$BODY_FILE" <<'PY'
import json
import sys
from pathlib import Path

path, name = sys.argv[1], sys.argv[2]
print(json.dumps({"query": Path(path).read_text(), "name": name}))
PY

            HTTP_CODE="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out "%{http_code}"               --request POST               "https://api.supabase.com/v1/projects/$PROJECT_REF/database/migrations"               --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"               --header "Content-Type: application/json"               --data-binary "@$BODY_FILE")"

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "Migration $VERSION failed (HTTP $HTTP_CODE)."
              cat "$RESPONSE_FILE"
              exit 1
            fi

            echo "Migration $VERSION applied successfully."
          done
