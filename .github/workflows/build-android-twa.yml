name: Build SpeakFlow Android TWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/twa-manifest.json"
      - ".github/workflows/build-android-twa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Android project from TWA manifest
        run: |
          docker run --rm \
            -v "$PWD/android:/workspace" \
            -v speakflow-android-sdk:/root/.bubblewrap/android_sdk \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            update --skipVersionUpgrade

      - name: Accept Android SDK licenses and install API 36
        run: |
          docker run --rm \
            --entrypoint sh \
            -v "$PWD/android:/workspace" \
            -v speakflow-android-sdk:/root/.bubblewrap/android_sdk \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            -lc 'SDK_ROOT=/root/.bubblewrap/android_sdk; SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"; test -n "$SDKMANAGER"; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.1.0"'

      - name: Build unsigned Android artifacts
        run: |
          docker run --rm \
            -v "$PWD/android:/workspace" \
            -v speakflow-android-sdk:/root/.bubblewrap/android_sdk \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            build --skipSigning

      - name: Verify Android 16 target
        run: |
          grep -R "targetSdkVersion 36" android/app/build.gradle
          grep -R "compileSdkVersion 36" android/app/build.gradle

      - name: Build debug APK for device testing
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Collect Android artifacts
        run: |
          mkdir -p android/dist
          find android -type f -name "*.aab" -print -exec cp {} android/dist/ \;
          DEBUG_APK="$(find android/app/build/outputs/apk/debug -type f -name "*.apk" -print -quit)"
          test -n "$DEBUG_APK"
          cp "$DEBUG_APK" android/dist/speakflow-debug.apk
          test -n "$(find android/dist -type f -name "*.aab" -print -quit)"
          test -f android/dist/speakflow-debug.apk

      - name: Upload Android test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speakflow-android-test
          path: android/dist/
          if-no-files-found: error
          retention-days: 7
