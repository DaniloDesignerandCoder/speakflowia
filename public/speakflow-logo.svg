<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 120"
  role="img"
  aria-labelledby="speakflowLogoTitle"
>
  <title id="speakflowLogoTitle">SpeakFlow</title>

  <defs>
    <linearGradient
      id="speakflowGradient"
      x1="15%"
      y1="10%"
      x2="85%"
      y2="90%"
    >
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#dce5ff" />
      <stop offset="100%" stop-color="#7d96ff" />
    </linearGradient>

    <filter
      id="speakflowGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g
